name: CI
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tgcurator_ci
          POSTGRES_PASSWORD: ci-only-ephemeral-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tgcurator_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TGCURATOR_ENVIRONMENT: test
      TGCURATOR_TEST_POSTGRES_ADMIN_URL: postgresql+asyncpg://tgcurator_ci:ci-only-ephemeral-password@127.0.0.1:5432/postgres
      TGCURATOR_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[runtime,dev]'
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m compileall -q apps tgcurator migrations tests
      # Includes opt-in PostgreSQL migrations + repository regressions, not offline SQL alone.
      - run: python -m pytest -ra
      - if: hashFiles('scripts/backup-common.sh') != ''
        run: bash -n scripts/backup-common.sh scripts/backup-postgres.sh scripts/backup-media.sh scripts/restore-postgres.sh
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: web
        shell: bash
        run: |
          if test -f web/package.json; then echo 'present=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.web.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.web.outputs.present == 'true'
        working-directory: web
        run: npm ci
      - if: steps.web.outputs.present == 'true'
        working-directory: web
        run: npm run typecheck && npm test && npm run build
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[runtime,dev]'
      - if: hashFiles('web/package.json') != ''
        run: python scripts/check-deployment.py
        timeout-minutes: 20
