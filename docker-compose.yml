# TG-VLM-Curator Production Docker Compose Topology (Section 43)
#
# Architectural Invariants:
# 1. PostgreSQL (`postgres-data`) and Archive Storage (`archive-data`) are the sole durable
#    business stores; Redis (`redis-data`) carries reconstructable UUID-only Celery wake-ups.
# 2. External VLM/LLM inference servers (OpenAI-compatible HTTP endpoints) are
#    strictly decoupled and MUST NEVER be bundled into this Compose stack.
# 3. `APP_MASTER_KEY` is mounted via a read-only file secret (`app_master_key`) and must be
#    backed up independently from PostgreSQL dumps.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-backend-common: &backend-common
  image: ${COMPOSE_PROJECT_NAME:-tgcurator}-backend:local
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  restart: unless-stopped
  stop_signal: SIGTERM
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  environment: &backend-env
    TGCURATOR_ENVIRONMENT: ${TGCURATOR_ENVIRONMENT:-production}
    TGCURATOR_LOG_LEVEL: ${TGCURATOR_LOG_LEVEL:-INFO}
    TGCURATOR_DATABASE_URL: ${TGCURATOR_DATABASE_URL:-}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:-tgcurator}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    POSTGRES_DB: ${POSTGRES_DB:-tgcurator}
    TGCURATOR_CELERY_BROKER_URL: redis://redis:6379/0
    TGCURATOR_APP_MASTER_KEY_FILE: /run/secrets/app_master_key
    TGCURATOR_APP_MASTER_KEY_ID: ${TGCURATOR_APP_MASTER_KEY_ID:-primary}
    TGCURATOR_ARCHIVE_ROOT: /var/lib/tgcurator/archive
    TGCURATOR_TEMP_MEDIA_DIR: /var/lib/tgcurator/tmp
    TGCURATOR_HEARTBEAT_DIR: /tmp/tgcurator-heartbeats

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tgcurator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-tgcurator}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tgcurator} -d $${POSTGRES_DB:-tgcurator}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    <<: *backend-common
    command: ["python", "-m", "uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    secrets:
      - app_master_key
    volumes:
      - archive-data:/var/lib/tgcurator/archive:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # API readiness checks PostgreSQL only; external Telegram/Inference unavailability
      # degrades business operations without taking the Admin API offline (Section 41).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: ${COMPOSE_PROJECT_NAME:-tgcurator}-web:local
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    ports:
      - "${TGCURATOR_BIND_ADDRESS:-0.0.0.0}:${TGCURATOR_HTTP_PORT:-80}:80"
      - "${TGCURATOR_BIND_ADDRESS:-0.0.0.0}:${TGCURATOR_HTTPS_PORT:-443}:443"
    environment:
      TGCURATOR_HTTPS_REDIRECT_PORT: ${TGCURATOR_HTTPS_REDIRECT_PORT:-443}
      TGCURATOR_SERVER_NAME: ${TGCURATOR_SERVER_NAME:-}
      NGINX_ENVSUBST_FILTER: TGCURATOR_HTTPS_REDIRECT_PORT|TGCURATOR_SERVER_NAME
    volumes:
      - type: bind
        source: ${TGCURATOR_TLS_CERT_HOST_PATH:?TLS certificate fullchain path is required}
        target: /etc/nginx/tls/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TGCURATOR_TLS_KEY_HOST_PATH:?TLS private key path is required}
        target: /etc/nginx/tls/privkey.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  telegram-ingestor:
    <<: *backend-common
    command: ["python", "-m", "apps.telegram_ingestor"]
    deploy:
      replicas: 1
    secrets:
      - app_master_key
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "apps.healthcheck", "--role", "ingestor", "--probe", "ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  scheduler:
    <<: *backend-common
    command: ["python", "-m", "apps.scheduler", "--interval-seconds", "5"]
    deploy:
      replicas: 1
    secrets:
      - app_master_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "apps.healthcheck", "--role", "scheduler", "--probe", "ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker-media:
    <<: *backend-common
    command: ["python", "-m", "apps.worker", "--role", "media", "--concurrency", "${WORKER_MEDIA_CONCURRENCY:-2}"]
    stop_grace_period: 60s
    secrets:
      - app_master_key
    volumes:
      - archive-data:/var/lib/tgcurator/archive
      - temp-media:/var/lib/tgcurator/tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "apps.healthcheck", "--role", "worker", "--probe", "ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker-analysis:
    <<: *backend-common
    command: ["python", "-m", "apps.worker", "--role", "analysis", "--concurrency", "${WORKER_ANALYSIS_CONCURRENCY:-4}"]
    stop_grace_period: 90s
    secrets:
      - app_master_key
    volumes:
      - archive-data:/var/lib/tgcurator/archive:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "apps.healthcheck", "--role", "worker", "--probe", "ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker-publish:
    <<: *backend-common
    command: ["python", "-m", "apps.worker", "--role", "publish", "--concurrency", "${WORKER_PUBLISH_CONCURRENCY:-1}"]
    stop_grace_period: 45s
    secrets:
      - app_master_key
    volumes:
      - archive-data:/var/lib/tgcurator/archive:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "apps.healthcheck", "--role", "worker", "--probe", "ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker-maintenance:
    <<: *backend-common
    command: ["python", "-m", "apps.worker", "--role", "maintenance", "--concurrency", "1"]
    stop_grace_period: 60s
    secrets:
      - app_master_key
    volumes:
      - archive-data:/var/lib/tgcurator/archive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "apps.healthcheck", "--role", "worker", "--probe", "ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  archive-tools:
    image: postgres:16-alpine
    profiles: ["operations"]
    restart: "no"
    user: "0:0"
    entrypoint: []
    command: ["true"]
    volumes:
      - archive-data:/archive

secrets:
  app_master_key:
    file: ${TGCURATOR_MASTER_KEY_HOST_PATH:-./secrets/app_master_key.txt}

volumes:
  postgres-data:
  redis-data:
  archive-data:
  temp-media:
